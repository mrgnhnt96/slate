[workspace]
resolver = "3"
members = ["crates/slate", "crates/slate-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
slate = { path = "crates/slate", default-features = false }
# The GPUI the apps use (kaepora, midna, taskboard).
gpui-kit = { version = "0.7", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
# The objc calls that hide the window are the only unsafe code, and they
# live in crates/slate/src/mac.rs with an explicit allow.
unsafe_code = "deny"
# objc 0.2's msg_send! checks a `cargo-clippy` feature that no crate has.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
